[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragkit"
version = "0.1.0"
description = "Учебный пакет курса AI-инженера: чанки, документы, настройки"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.53",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "httpx>=0.28",  # services/http_retry.py: клиент к чужим API (Ф3-10)
]

[tool.setuptools]
packages = ["ragkit", "api", "api.routers", "services", "tools"]   # в корне ещё week-*/ и todo/ — берём явно

[project.optional-dependencies]
dev = [
    "mypy>=2.4",
    "ruff>=0.17",
    "pre-commit>=4.0",
    "pytest>=9.0",
    "httpx2>=2.13",  # starlette 1.x: TestClient работает на httpx2
    "pytest-randomly>=5.0",  # случайный порядок тестов
    "pytest-xdist>=3.8",  # pytest -n 4
    "pytest-cov>=7.0",  # --cov --cov-branch
    "respx>=0.23",  # стабы HTTP для httpx: маршруты, последовательности ответов
    "pytest-asyncio>=1.4",  # async def тесты
    "ollama>=0.6.3",  # неделя 4: клиент к локальной модели
]

# ---------------------------------------------------------------------------
# mypy: строгая проверка пакета ragkit (учебные week-*/ не типизированы)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["ragkit", "api", "services", "tools", "tests", "week-03/lesson_05.py", "week-03/lesson_06.py", "week-03/lesson_07.py", "week-03/lesson_08.py", "week-03/lesson_09", "week-03/lesson_10.py", "week-03/lesson_10", "week-04/lesson_01.py"]   # lesson_05_any.py — намеренные ошибки
strict = true
warn_unreachable = true          # НЕ входит в strict: ловит код после return
show_error_codes = true
warn_unused_ignores = true       # (входит в strict, пишу явно — это решение, а не случайность)
plugins = ["pydantic.mypy"]      # понимает конструкторы pydantic-моделей и Settings

[tool.pytest.ini_options]
testpaths = ["tests"]
# -m "not slow": контрактные тесты против живого API — только явно: pytest -m slow
addopts = "-q --strict-markers --strict-config -m 'not slow'"
asyncio_mode = "auto"  # async def тест запускается без @pytest.mark.asyncio
# без явной настройки pytest-asyncio 1.4 выдаёт PytestDeprecationWarning, а у нас это ошибка
asyncio_default_fixture_loop_scope = "function"
# Все предупреждения — ошибки; исключения поштучно, по тексту сообщения.
filterwarnings = [
    "error",
    # starlette < 1.10 (замерено на 1.6.0) обращается к anyio.abc.BlockingPortal.
    # В starlette 1.10 из requirements.txt предупреждения нет — игнор только для старых окружений.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = ["slow: тест дольше секунды или ходит в живую сеть; в обычный прогон не входит"]

# ---------------------------------------------------------------------------
# ruff: линтер и форматтер для всего репозитория
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"         # = requires-python; UP-правила не предложат синтаксис новее
extend-exclude = [
    ".venv",
    "week-03/lesson_05_demo.py",  # семь НАМЕРЕННЫХ ошибок задания 1; явный запуск его проверит
]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "A", "SIM", "UP", "RET", "C4", "PTH", "I"]

[tool.ruff.lint.per-file-ignores]
# Учебные файлы: длинные комментарии-объяснения рядом с кодом и намеренные
# демонстрации ловушек. Пакет ragkit под эти исключения не попадает.
"week-*/**" = ["E501", "PTH", "RET504"]
"todo/**" = ["PTH"]
